name: CI

permissions:
  contents: read

on:
  # 直推 main 也要校验：手机端发短文不会先在本地构建，
  # 格式或 schema 出错时这里是唯一能在 CF Pages 部署前后发现问题的地方。
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 3

    strategy:
      matrix:
        node-version: ["24"]

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      # 放在最前面：不装依赖也能跑，几秒出结果。
      # 手机端发布时文件名一旦混入空格，URL 会被截断、扩展名丢失，
      # GitHub 照样返回 201 成功，但文件不匹配内容集合的 glob，
      # 构建静默忽略它——站点上什么都没有。这一步专门抓这种静默失败。
      - name: "🗂️ 检查内容文件都会被收录"
        run: |
          orphans=$(find src/content -type f ! -name '_*' ! -name '*.md' ! -name '*.mdx')
          if [ -n "$orphans" ]; then
            echo "::error::以下文件不会被内容集合收录，发布后站点上看不到"
            echo "$orphans" | sed 's/^/  /'
            echo "内容集合的 glob 是 **/[^_]*.{md,mdx}：需以 .md/.mdx 结尾，且不以 _ 开头。"
            exit 1
          fi
          echo "内容目录检查通过。"

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: "📝 Checking code format"
        run: pnpm run format:check

      - name: "🚀 Build the project"
        run: pnpm run build
